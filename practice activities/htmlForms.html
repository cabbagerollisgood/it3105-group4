<body>
    <form>
        <label for="firstname">First Name:</label>
        <input placeholder ="First Name"type = "text" name = "firstname" id = "firstname"> <br> <br>
        <label for = "Phonenumber"> Phone Number: </label>
        <input placeholder="xxxx-xxx-xxxx" type = "tel" id = "Phonenumber" pattern = "[0-9]{4}-[0-9]{3}-[0-9]{4}" >
        <br>
        <br> 
        <label for = "colors"> Colors: </label>
        <select id = "colors">
            <option value = "pink"> Pink </option>
            <option value = "peach"> Peach</option>
            <option value = "periwinkle">Periwinkle</option>
            <option value = "purple">Purple</option>
        </select><br><br>

        <label for = "pk-choice"> Choose a Pokemon:</label>
        <input list = "pk-opts" id = "pk-choice" name = "pk-choice">
        <datalist id = "pk-opts">
            <option value = "Pikachu"> 
            <option value = "Jigglypuff"> 
            <option value = "Squirtle">
            <option value = "Psyduck">
       
        </datalist>
        <button type = "submit"> Submit </button>
        <button type ="reset"> Reset</button>
    </form>


</body>
